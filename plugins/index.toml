# Plugin registry index.
#
# This is what "Check updates" in Settings fetches — raw, over HTTPS, from
# https://raw.githubusercontent.com/ksavkin/tickover/main/plugins/index.toml
# — and diffs against the manifests already installed. Schema is owned by
# `src/plugin/registry.rs` (`RegistryIndex`/`RegistryEntry`); this file is
# just data.
#
# `sha256` is over the referenced manifest file's exact bytes (`shasum -a 256
# plugins/<id>.toml`) and is checked *before* the downloaded manifest is
# parsed — editing a manifest without bumping the matching entry here (both
# `version` and `sha256`) breaks the download for everyone, and
# `tests/registry_index.rs` fails the build to say so.

schema_version = 1

