id          = "codex"
name        = "Codex"
version     = "2.5.2"
description = "OpenAI Codex CLI usage: 5h/weekly windows plus a credits balance."
manifest    = "codex.toml"
sha256      = "6cd4176d09b4352fe930780ff3a1a2ab10cfab97f7af9a4813625199f4ac558a"

