id          = "codex"
name        = "Codex"
version     = "2.5.1"
description = "OpenAI Codex CLI usage: 5h/weekly windows plus a credits balance."
manifest    = "codex.toml"
sha256      = "5c1a73cfc3df978684a08a6061a2a1733576159adb1bc5fb9d98ad7d25701de9"

