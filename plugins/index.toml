id          = "codex"
name        = "Codex"
version     = "2.6.0"
description = "OpenAI Codex CLI usage: 5h/weekly windows plus a credits balance."
manifest    = "codex.toml"
sha256      = "ee3e7a947d49a03f8f4f91fb70ff4cf888171ad23c7887479a6819f26bdeeded"

